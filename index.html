<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tracker de Gestos — Interfaz Limpia</title>

    <link rel="stylesheet" href="style.css" />

    <!--
        MediaPipe Hands: detección de manos.
        Soporta hasta 2 manos simultáneas.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!--
        Contenedor principal de la cámara.
        - <video>: stream de la cámara.
        - <canvas>: dibujamos el esqueleto de las manos encima.
    -->
    <div id="camera-container">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <!--
        Texto del gesto detectado.
        Solo muestra el nombre del gesto, sin cajas ni bordes.
        Se posiciona en la parte superior central de la pantalla.
    -->
    <div id="gesture-text" class="hidden">
        <span id="gesture-name">---</span>
    </div>

    <!-- Mensaje de estado (carga, errores) -->
    <div id="status-message" class="status hidden">
        <p id="status-text"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
